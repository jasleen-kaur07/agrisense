server:
  port: ${PORT:8082}
  shutdown: graceful
spring:
  application:
    name: farm-advisory-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/agrisense?currentSchema=advisory}
    username: ${SPRING_DATASOURCE_USERNAME:advisory}
    password: ${SPRING_DATASOURCE_PASSWORD:advisory}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    default-schema: advisory
    schemas: advisory
    create-schemas: true
  jackson:
    default-property-inclusion: non_null
management:
  endpoints.web.exposure.include: health
  endpoint.health.probes.enabled: true
advisory:
  security:
    jwks-url: ${IDENTITY_JWKS_URL:http://identity-service:8081/.well-known/jwks.json}
    issuer: agrisense-identity
  data:
    url: ${DATA_SERVICE_URL:http://data-service:8083}
    internal-token: ${INTERNAL_API_TOKEN:}
    connect-timeout-ms: 2000
    read-timeout-ms: 4000
    cb-window-size: 20
    cb-min-calls: 10
    cb-failure-rate: 50
    cb-open-seconds: 30
  alerts:
    enabled: ${ALERTS_ENABLED:true}
    interval-ms: ${ALERTS_INTERVAL_MS:3600000}
    initial-delay-ms: 60000
    max-farms-per-run: ${ALERTS_MAX_FARMS:200}
