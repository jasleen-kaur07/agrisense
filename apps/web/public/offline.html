<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline | AgriSense</title>
<style>
  body{margin:0;background:#f4f0e7;color:#252b28;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Devanagari",sans-serif;display:grid;min-height:100vh;place-items:center;padding:24px}
  main{max-width:520px}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;color:#19342d;font-size:32px;margin:0 0 12px}
  p{line-height:1.6;color:#46504a}
  a,button{display:inline-block;margin-top:12px;min-height:44px;padding:0 20px;line-height:44px;border-radius:8px;background:#19342d;color:#fffdf8;text-decoration:none;border:0;font-size:16px;cursor:pointer}
  a:focus-visible,button:focus-visible{outline:3px solid #52623a;outline-offset:2px}
  hr{border:0;border-top:1px solid #dcd8cd;margin:28px 0}
</style>
</head>
<body>
<main>
  <h1>You are offline</h1>
  <p>AgriSense needs an internet connection to load your fields, crop guides and weather. Nothing has been lost. Please reconnect and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
  <hr>
  <h1 lang="hi">आप ऑफ़लाइन हैं</h1>
  <p lang="hi">आपके खेत, फसल गाइड और मौसम देखने के लिए इंटरनेट चाहिए। कृपया दोबारा कनेक्ट करके प्रयास करें।</p>
</main>
</body>
</html>
