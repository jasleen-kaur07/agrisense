name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix: { service: [data-service, ml-service] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r services/${{ matrix.service }}/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: services/${{ matrix.service }}
  java:
    runs-on: ubuntu-latest
    strategy:
      matrix: { service: [identity-service, farm-advisory-service, gateway] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B -q verify
        working-directory: services/${{ matrix.service }}
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: apps/web/package-lock.json }
      # Vue 3 + Vite SPA (apps/web). apps/web-next-legacy is the retired Next.js reference and is not built here.
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
  images:
    runs-on: ubuntu-latest
    needs: [python, java, web]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose build
      - uses: aquasecurity/trivy-action@0.28.0
        with: { scan-type: fs, scan-ref: ., severity: 'HIGH,CRITICAL', ignore-unfixed: true, exit-code: '0' }
